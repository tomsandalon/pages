    /* ── Responsive hook ── */
    function useIsMobile(bp = 700) {
      const [m, setM] = useState(typeof window !== "undefined" ? window.innerWidth < bp : false);
      useEffect(() => {
        const h = () => setM(window.innerWidth < bp);
        window.addEventListener("resize", h);
        return () => window.removeEventListener("resize", h);
      }, [bp]);
      return m;
    }

    /* ── Small shared components ── */
    function RegionPill({ region }) {
      const r = REGIONS[region];
      return (
        <span style={{
          display: "inline-block", padding: "2px 10px", borderRadius: 99,
          fontSize: 11, fontWeight: 600, letterSpacing: "0.04em",
          color: r.color, background: r.bg,
          border: `1px solid ${r.color}22`, textTransform: "uppercase",
        }}>{r.label}</span>
      );
    }

    function InfoBlock({ icon, label, text, color }) {
      return (
        <div style={{
          background: "#fafaf8", borderRadius: 10, padding: "11px 13px",
          borderLeft: `3px solid ${color}55`,
        }}>
          <div style={{
            fontSize: 11, fontWeight: 700, color: "#999", marginBottom: 3,
            textTransform: "uppercase", letterSpacing: "0.04em",
          }}>{icon} {label}</div>
          <div style={{ fontSize: 13, color: "#444", lineHeight: 1.5 }}>{text}</div>
        </div>
      );
    }

    /* ── Mobile horizontal day picker ── */
    function MobileDayPicker({ activeDay, onSelect }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current?.children[activeDay]) {
          ref.current.children[activeDay].scrollIntoView({
            inline: "center", behavior: "smooth", block: "nearest",
          });
        }
      }, [activeDay]);

      return (
        <div ref={ref} style={{
          display: "flex", gap: 6, overflowX: "auto", padding: "6px 0 10px",
          WebkitOverflowScrolling: "touch", scrollbarWidth: "none",
        }}>
          {DAYS.map((d, i) => {
            const r = REGIONS[d.region];
            const on = activeDay === i;
            return (
              <button key={i} onClick={() => onSelect(i)} style={{
                flexShrink: 0, display: "flex", flexDirection: "column",
                alignItems: "center", padding: "8px 8px 6px",
                borderRadius: 10, minWidth: 50,
                border: on ? `2px solid ${r.color}` : "2px solid transparent",
                background: on ? r.bg : "#fff",
                cursor: "pointer",
                boxShadow: on ? `0 2px 8px ${r.color}20` : "0 1px 3px #0001",
              }}>
                <span style={{ fontSize: 17, lineHeight: 1 }}>{d.icon}</span>
                <span style={{
                  fontSize: 9, fontWeight: 700, marginTop: 3,
                  color: on ? r.color : "#999", whiteSpace: "nowrap",
                }}>{d.date}</span>
              </button>
            );
          })}
        </div>
      );
    }

          background: isActive ? r.bg : "#fff",

        }}>

                    whiteSpace: "nowrap",
                  }}>
                    {isMobile ? `$${b.usd.toLocaleString()}` : `¥${b.yen.toLocaleString()} / $${b.usd.toLocaleString()}`}
                  </span>
                </div>
                <div style={{ height: 8, background: "#f0eeeb", borderRadius: 4, overflow: "hidden" }}>
                  <div style={{
                    height: "100%", width: `${(b.usd / max) * 100}%`,
                    background: "linear-gradient(90deg, #D4874D, #E8594F)",
                    borderRadius: 4,
                  }} />
                </div>
              </div>
            ))}
          </div>
          <div style={{
            marginTop: 16, padding: "12px 14px", background: "#fafaf8",
            borderRadius: 10, display: "flex", justifyContent: "space-between",
            borderTop: "2px solid #e8e4df",
          }}>
            <span style={{ fontSize: 15, fontWeight: 700 }}>Total</span>
            <span style={{ fontSize: 15, fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>
              ${total.toLocaleString()}
            </span>
          </div>
          <p style={{ fontSize: 12, color: "#aaa", marginTop: 8, lineHeight: 1.5 }}>
            ~${Math.round(total / 2).toLocaleString()}/person • ~${Math.round(total / 2 / 22)}/person/day
          </p>
        </div>
      );
    }

    /* ── Tickets / Prep tab ── */
    function TicketsTab({ isMobile }) {
      return (
        <div>
          <h2 style={{
            fontSize: isMobile ? 18 : 20, fontWeight: 700, margin: "0 0 4px 0",
            fontFamily: "'Noto Serif JP', Georgia, serif",
          }}>🎟️ Tickets & Bookings</h2>
          <p style={{ fontSize: 13, color: "#888", margin: "0 0 16px 0" }}>
            Time-sensitive — don't miss these windows!
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {TICKETS.map((t, i) => (
              <div key={i} style={{
                padding: "12px 14px", borderRadius: 10,
                background: t.priority === "high" ? "#FFF5F4" : "#fafaf8",
                border: t.priority === "high" ? "1px solid #E8594F22" : "1px solid #e8e4df",
              }}>
                <div style={{
                  display: "flex", justifyContent: "space-between",
                  alignItems: "center", marginBottom: 4, gap: 6, flexWrap: "wrap",
                }}>
                  <span style={{ fontSize: 14, fontWeight: 600, color: "#1a1a1a" }}>{t.what}</span>
                  {t.priority === "high" && (
                    <span style={{
                      fontSize: 10, fontWeight: 700, color: "#E8594F",
                      background: "#E8594F15", padding: "2px 8px",
                      borderRadius: 99, textTransform: "uppercase", flexShrink: 0,
                    }}>Priority</span>
                  )}
                </div>
                <div style={{ fontSize: 12, color: "#666" }}>
                  📅 <strong>{t.sale}</strong> — {t.via}
                </div>
              </div>
            ))}
          </div>

          <h3 style={{
            fontSize: 16, fontWeight: 700, margin: "22px 0 10px",
            fontFamily: "'Noto Serif JP', Georgia, serif",
          }}>📱 Apps to Download</h3>
          <div style={{
            display: "grid",
            gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr",
            gap: 8,
          }}>
            {[
              ["Google Maps", "Transit + driving nav"],
              ["NAVITIME", "Best transit app"],
              ["Google Translate", "Camera translation"],
              ["SmartEX", "Shinkansen booking"],
              ["GO Taxi", "Ride-hailing"],
              ["Safety Tips", "Earthquake alerts"],
            ].map(([name, desc], i) => (
              <div key={i} style={{
                padding: "10px 12px", borderRadius: 8,
                background: "#fafaf8", border: "1px solid #e8e4df",
              }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#333" }}>{name}</div>
                <div style={{ fontSize: 11, color: "#888" }}>{desc}</div>
              </div>
            ))}
          </div>

          <h3 style={{
            fontSize: 16, fontWeight: 700, margin: "22px 0 10px",
            fontFamily: "'Noto Serif JP', Georgia, serif",
          }}>🎒 Rainy Season Essentials</h3>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {[
              { item: "Compact umbrella", cat: "rain" },
              { item: "Waterproof jacket", cat: "rain" },
              { item: "Waterproof shoes", cat: "rain" },
              { item: "Quick-dry clothing", cat: "rain" },
              { item: "Small towel", cat: "rain" },
              { item: "1949 IDP + license", cat: "docs" },
              { item: "Passports", cat: "docs" },
              { item: "eSIMs (2×)", cat: "tech" },
              { item: "Portable charger", cat: "tech" },
              { item: "¥10k–20k cash", cat: "money" },
            ].map((p, i) => (
              <span key={i} style={{
                padding: "5px 10px", borderRadius: 8, fontSize: 13, color: "#444",
                background: p.cat === "rain" ? "#E3F2FD" : p.cat === "docs" ? "#FFF3E0"
                  : p.cat === "tech" ? "#F3E5F5" : "#E8F5E9",
                border: "1px solid #0001",
              }}>{p.item}</span>
            ))}
          </div>
        </div>
      );
    }

    /* ── Timeline bar (mini) ── */
    function TimelineBar({ activeDay, onSelect }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 2, width: "100%" }}>
          {DAYS.map((d, i) => {
            const r = REGIONS[d.region]; const on = activeDay === i;
            return (
              <button key={i} onClick={() => onSelect(i)}
                title={`${d.date} — ${d.title}`}
                style={{
                  flex: 1, minWidth: 4, height: on ? 18 : 10, borderRadius: 3,
                  background: on ? r.color : `${r.color}44`,
                  border: "none", cursor: "pointer", transition: "all 0.15s ease",
                  padding: 0,
                }}
              />
            );
          })}
        </div>
      );
    }

    /* ──────────────── MAIN APP ──────────────── */
    function JapanTripCanvas() {
      const [activeDay, setActiveDay] = useState(0);
      const [tab, setTab] = useState("itinerary");
      const isMobile = useIsMobile();
      const listRef = useRef(null);

      // Scroll sidebar to active card (desktop only)
      useEffect(() => {
        if (!isMobile && listRef.current?.children[activeDay]) {
          listRef.current.children[activeDay].scrollIntoView({
            block: "nearest", behavior: "smooth",
          });
        }
      }, [activeDay, isMobile]);

      // Swipe left/right to change day on mobile
      const touch = useRef({ x: 0, y: 0 });
      const onTS = (e) => {
        touch.current.x = e.touches[0].clientX;
        touch.current.y = e.touches[0].clientY;
      };
      const onTE = (e) => {
        if (tab !== "itinerary") return;
        const dx = e.changedTouches[0].clientX - touch.current.x;
        const dy = e.changedTouches[0].clientY - touch.current.y;
        // Only trigger if horizontal swipe dominates
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          if (dx > 0 && activeDay > 0) setActiveDay(activeDay - 1);
          else if (dx < 0 && activeDay < DAYS.length - 1) setActiveDay(activeDay + 1);
        }
      };

      const px = isMobile ? 14 : 32;

      return (
        <div onTouchStart={onTS} onTouchEnd={onTE} style={{
          fontFamily: "'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          background: "#f8f6f3", minHeight: "100vh", color: "#1a1a1a",
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;700&display=swap');
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(5px); }
              to { opacity: 1; transform: translateY(0); }
            }
            * { box-sizing: border-box; margin: 0; }
            ::-webkit-scrollbar { width: 4px; height: 4px; }
            ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
            ::-webkit-scrollbar-track { background: transparent; }
          `}</style>

          {/* ── HEADER ── */}
          <div style={{
            background: "linear-gradient(135deg, #1a1a1a 0%, #2d2620 100%)",
            padding: isMobile ? "18px 14px 14px" : "26px 32px 18px",
            color: "#fff",
          }}>
            <div style={{ maxWidth: 1200, margin: "0 auto" }}>
              <div style={{
                fontSize: 10, fontWeight: 600, color: "#D4874D",
                textTransform: "uppercase", letterSpacing: "0.12em", marginBottom: 4,
              }}>🇯🇵 May 30 — Jun 20, 2026 • 22 Days</div>
              <h1 style={{
                fontSize: isMobile ? 19 : 28, fontWeight: 700, marginBottom: 2,
                fontFamily: "'Noto Serif JP', Georgia, serif",
                background: "linear-gradient(90deg, #fff, #e8d5c0)",
                WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
              }}>Tom & Gil's Japan Adventure</h1>
              {!isMobile && (
                <p style={{ fontSize: 13, color: "#a09585", marginBottom: 0 }}>
                  Tokyo → Hakone → Fuji → Alps → Kanazawa → Osaka → Kōyasan → Kyoto → Tokyo
                </p>
              )}
              <div style={{ display: "flex", gap: 4, marginTop: 10 }}>
                {[
                  { id: "itinerary", label: isMobile ? "📅 Days" : "📅 Itinerary" },
                  { id: "budget", label: "💰 Budget" },
                  { id: "tickets", label: "🎟️ Prep" },
                ].map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)} style={{
                    padding: isMobile ? "6px 11px" : "7px 16px",
                    borderRadius: 8, border: "none",
                    fontSize: 13, fontWeight: 600, cursor: "pointer",
                    background: tab === t.id ? "#D4874D" : "#ffffff15",
                    color: tab === t.id ? "#fff" : "#a09585",
                  }}>{t.label}</button>
                ))}
              </div>
            </div>
          </div>

          {/* ── TIMELINE BAR (itinerary tab) ── */}
          {tab === "itinerary" && (
            <div style={{
              background: "#fff", borderBottom: "1px solid #e8e4df",
              padding: isMobile ? "8px 14px" : "10px 32px",
            }}>
              <div style={{ maxWidth: 1200, margin: "0 auto" }}>
                {!isMobile && (
                  <div style={{ display: "flex", gap: 14, marginBottom: 6 }}>
                    {Object.entries(REGIONS).map(([k, v]) => (
                      <span key={k} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: "#888" }}>
                        <span style={{ width: 8, height: 8, borderRadius: 2, background: v.color, display: "inline-block" }} />
                        {v.label}
                      </span>
                    ))}
                  </div>
                )}
                <TimelineBar activeDay={activeDay} onSelect={setActiveDay} />
              </div>
            </div>
          )}

          {/* ── CONTENT ── */}
          <div style={{ maxWidth: 1200, margin: "0 auto", padding: `14px ${px}px 40px` }}>
            {tab === "itinerary" ? (
              isMobile ? (
                /* ──── MOBILE: horiz picker + detail ──── */
                <div>
                  <MobileDayPicker activeDay={activeDay} onSelect={setActiveDay} />

                  {/* Prev / Next buttons */}
                  <div style={{
                    display: "flex", justifyContent: "space-between",
                    alignItems: "center", marginBottom: 10,
                  }}>
                    <button onClick={() => setActiveDay(Math.max(0, activeDay - 1))}
                      disabled={activeDay === 0}
                      style={{
                        padding: "7px 14px", borderRadius: 8,
                        border: "1px solid #e0dcd7", background: "#fff",
                        fontSize: 13, fontWeight: 600, cursor: "pointer",
                        opacity: activeDay === 0 ? 0.3 : 1, color: "#555",
                      }}>← Prev</button>
                    <span style={{ fontSize: 12, fontWeight: 600, color: "#999" }}>
                      {activeDay + 1} / {DAYS.length}
                    </span>
                    <button onClick={() => setActiveDay(Math.min(DAYS.length - 1, activeDay + 1))}
                      disabled={activeDay === DAYS.length - 1}
                      style={{
                        padding: "7px 14px", borderRadius: 8,
                        border: "1px solid #e0dcd7", background: "#fff",
                        fontSize: 13, fontWeight: 600, cursor: "pointer",
                        opacity: activeDay === DAYS.length - 1 ? 0.3 : 1, color: "#555",
                      }}>Next →</button>
                  </div>

                  <div style={{
                    background: "#fff", borderRadius: 14,
                    padding: "18px 14px", boxShadow: "0 1px 6px #0001",
                  }}>
                    <DetailPanel day={DAYS[activeDay]} isMobile key={activeDay} />
                  </div>
                </div>
              ) : (
                /* ──── DESKTOP: sidebar + detail ──── */
                <div style={{ display: "flex", gap: 24 }}>
                  <div ref={listRef} style={{
                    width: 290, flexShrink: 0,
                    display: "flex", flexDirection: "column", gap: 6,
                    maxHeight: "calc(100vh - 220px)", overflowY: "auto", paddingRight: 6,
                  }}>
                    {DAYS.map((d, i) => (
                      <DayCard key={i} day={d} isActive={activeDay === i}
                        onClick={() => setActiveDay(i)} />
                    ))}
                  </div>
                  <div style={{
                    flex: 1, background: "#fff", borderRadius: 16,
                    padding: "28px 30px", boxShadow: "0 1px 8px #0001",
                    maxHeight: "calc(100vh - 220px)", overflowY: "auto",
                  }}>
                    <DetailPanel day={DAYS[activeDay]} isMobile={false} key={activeDay} />
                  </div>
                </div>
              )
            ) : tab === "budget" ? (
              <div style={{
                maxWidth: 640, background: "#fff", borderRadius: 14,
                padding: isMobile ? "18px 14px" : "28px 30px",
                boxShadow: "0 1px 6px #0001",
              }}>
                <BudgetTab isMobile={isMobile} />
              </div>
            ) : (
              <div style={{
                maxWidth: 640, background: "#fff", borderRadius: 14,
                padding: isMobile ? "18px 14px" : "28px 30px",
                boxShadow: "0 1px 6px #0001",
              }}>
                <TicketsTab isMobile={isMobile} />
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render the React app into the DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JapanTripCanvas />);
  </script>
</body>
</html>
